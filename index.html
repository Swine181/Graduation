<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graduation 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  overflow:hidden;height:100vh;
  display:flex;justify-content:center;align-items:center;
  background:radial-gradient(circle at top,#ff69b4,#120018 70%);
  font-family:Arial,Helvetica,sans-serif;
}
canvas{position:absolute;width:100%;height:100%;top:0;left:0;}
.container{position:relative;z-index:10;text-align:center;}
.gift-box{
  position:relative;width:220px;height:220px;margin:auto;cursor:pointer;
  transform-style:preserve-3d;animation:float 4s ease-in-out infinite;
}
.box{
  position:absolute;width:220px;height:160px;bottom:0;border-radius:25px;
  background:linear-gradient(145deg,#ff4da6,#ff1493);
  box-shadow:0 0 30px #ff69b4,0 0 80px #ff1493,inset 0 0 20px rgba(255,255,255,0.3);
}
.lid{
  position:absolute;width:240px;height:55px;left:-10px;top:30px;
  border-radius:20px;background:linear-gradient(145deg,#ff85c2,#ff5fb2);
  transition:1.2s;transform-origin:left center;
  box-shadow:0 8px 20px rgba(0,0,0,0.4);
}
.ribbon-v{position:absolute;width:35px;height:220px;left:50%;transform:translateX(-50%);background:linear-gradient(to right,#fff,#ffe6f2,#fff);z-index:5;}
.ribbon-h{position:absolute;width:220px;height:35px;top:80px;background:linear-gradient(to bottom,#fff,#ffe6f2,#fff);z-index:5;}
.bow{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:70px;height:70px;z-index:20;}
.bow::before,.bow::after{content:"";position:absolute;width:35px;height:55px;background:linear-gradient(145deg,#fff,#ffd6eb);border-radius:50px 50px 0 50px;}
.bow::before{left:0;transform:rotate(-35deg);}
.bow::after{right:0;transform:scaleX(-1) rotate(-35deg);}
.bow-center{position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:14px;left:50%;transform:translateX(-50%);}
.open .lid{transform:rotate(-120deg) translateY(-30px);}
.letter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.5);opacity:0;z-index:100;transition:1.5s;}
.show-letter{opacity:1;transform:translate(-50%,-70%) scale(1);}
.paper{
  width:700px;max-width:92vw;padding:45px 50px;border-radius:25px;
  background:linear-gradient(145deg,rgba(255,255,255,0.96),rgba(255,240,250,0.96));
  box-shadow:0 0 40px rgba(255,105,180,0.5),0 0 100px rgba(255,20,147,0.3);
  backdrop-filter:blur(10px);
}
.paper h2{margin-bottom:25px;font-size:38px;color:#ff1493;text-align:center;text-shadow:0 0 10px rgba(255,105,180,0.5);}
.paper p{font-size:30px;line-height:1.9;color:#b3005e;min-height:260px;white-space:pre-line;text-align:left;width:100%;}
h1{margin-top:40px;color:white;font-size:50px;text-shadow:0 0 10px #fff,0 0 20px #ff69b4,0 0 40px #ff1493;}
.year{margin-top:10px;font-size:70px;color:#ffd700;font-weight:bold;text-shadow:0 0 10px #ffd700,0 0 20px #ffcc00,0 0 40px #ffcc00;}
@keyframes float{0%{transform:translateY(0px);}50%{transform:translateY(-15px);}100%{transform:translateY(0px);}}
.firework{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:explode 1.2s linear forwards;}
@keyframes explode{0%{transform:scale(1);opacity:1;}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0;}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="container">
  <div class="gift-box" id="gift">
    <div class="lid"></div>
    <div class="box"></div>
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>
    <div class="bow"><div class="bow-center"></div></div>
  </div>
  <div class="letter" id="letter">
    <div class="paper">
      <h2>💌 Gửi chị Yến Viii dễ huông 💌</h2>
      <p id="typing"></p>
    </div>
  </div>
  <h1>🎓 GRADUATION 🎓</h1>
  <div class="year">2026</div>
</div>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class HeartParticle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * canvas.width;
    this.y = init ? Math.random() * canvas.height : canvas.height + 20;
    this.size = Math.random() * 6 + 2;
    this.speedY = Math.random() * 1.2 + 0.4;
    this.speedX = (Math.random() - 0.5) * 0.6;
    this.alpha = Math.random() * 0.7 + 0.2;
    this.alphaDir = (Math.random() > 0.5 ? 1 : -1) * 0.005;
    const palette = [
      [255,105,180],[255,20,147],[255,182,193],
      [255,215,0],[255,160,122],[221,160,221]
    ];
    this.color = palette[Math.floor(Math.random()*palette.length)];
    this.rotation = (Math.random()-0.5)*0.4;
    this.rotSpeed = (Math.random()-0.5)*0.02;
    this.wobble = Math.random()*Math.PI*2;
    this.wobbleSpeed = Math.random()*0.04+0.01;
  }
  update() {
    this.y -= this.speedY;
    this.x += Math.sin(this.wobble)*0.4 + this.speedX;
    this.wobble += this.wobbleSpeed;
    this.rotation += this.rotSpeed;
    this.alpha += this.alphaDir;
    if(this.alpha > 0.9 || this.alpha < 0.15) this.alphaDir *= -1;
    if(this.y < -20) this.reset(false);
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rotation);
    ctx.globalAlpha = this.alpha;
    const [r,g,b] = this.color;
    const s = this.size;
    ctx.shadowColor = `rgb(${r},${g},${b})`;
    ctx.shadowBlur = s * 2;
    // vẽ trái tim hạt
    ctx.beginPath();
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(-s, -s*0.5, -s*1.8, s*0.6, 0, s*1.6);
    ctx.bezierCurveTo(s*1.8, s*0.6, s, -s*0.5, 0, s*0.3);
    ctx.closePath();
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fill();
    ctx.restore();
  }
}

let particles = [];
for(let i=0;i<120;i++) particles.push(new HeartParticle());

function animate() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();

const gift = document.getElementById("gift");
const letter = document.getElementById("letter");
const typing = document.getElementById("typing");

const text =
`Chúc mừng tốt nghiệp chị yêu!
Mong rằng trên chặng đường phía trước,
chị sẽ luôn kiên định với ước mơ,
mạnh mẽ vượt qua mọi thử thách,
biến khó khăn thành cơ hội
và từng bước chạm tới
những điều chị hằng mong muốn.

Hy vọng rằng sau ngày hôm nay,
chị sẽ luôn thật hạnh phúc,
tự tin với con đường mình chọn
và tỏa sáng theo cách riêng của mình ✨💖`;

gift.addEventListener("click", () => {
  gift.classList.add("open");
  letter.classList.add("show-letter");
  typeWriter();
  setTimeout(createFireworks, 5000);
});

let i = 0;
function typeWriter() {
  if(i < text.length) {
    typing.innerHTML += text.charAt(i);
    i++;
    setTimeout(typeWriter, 40);
  }
}

function createFireworks() {
  for(let i=0;i<120;i++){
    const fire = document.createElement("div");
    fire.className = "firework";
    fire.style.left = `${window.innerWidth/2}px`;
    fire.style.top = `${window.innerHeight/2}px`;
    fire.style.background = `hsl(${Math.random()*360},100%,60%)`;
    fire.style.setProperty("--x",`${(Math.random()-0.5)*700}px`);
    fire.style.setProperty("--y",`${(Math.random()-0.5)*700}px`);
    document.body.appendChild(fire);
    setTimeout(()=>fire.remove(),1200);
  }
}

window.addEventListener("resize",()=>{
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});
</script>
</body>
</html>
